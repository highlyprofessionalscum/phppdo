name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyse:
    name: Static analysis and unit runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: odbc
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: composer check
        run: composer check --no-interaction

  docker:
    name: Docker image (full PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t phppdo .
